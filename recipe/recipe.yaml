schema_version: 1

context:
  name: bioio-conversion
  version: "3.1.0"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bioio_conversion-${{ version }}.tar.gz
  sha256: da757430f9e4374cb0b1f89c27b6c974c3285e58f35247c27dee2bf5a2e95695

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bioio-convert = bioio_conversion.bin.cli_convert:main
      - bioio-batch-convert = bioio_conversion.bin.cli_batch_convert:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - bioio >=3.0.0
    - bioio-base >=3.4.0
    - bioio-ome-zarr >=3.6.0
    - numpy >=1.24.0
    - dask-core >=2021.10.0
    - numcodecs >=0.10.0
    - psutil >=5.8.0
    - scikit-image >=0.19.0
    - xmltodict >=0.13.0
    - distributed

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - bioio_conversion
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - bioio-convert --help
      - bioio-batch-convert --help

about:
  summary: A BioIO conversion tool for going between image formats
  homepage: https://github.com/bioio-devs/bioio-conversion
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - imagejan
